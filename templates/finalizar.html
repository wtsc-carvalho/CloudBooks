{% extends "base.html" %}
{% block titulo %}Finalizar compra{% endblock %}
{% block conteudo %}
<h1>Finalizar compra</h1>
<form method="post" class="formulario">
  {% csrf_token %}
  {{ form.as_p }}
  <p class="resumo-linha"><span>Total a pagar</span><strong>R$ {{ total }}</strong></p>
  <button class="botao">Confirmar pedido</button>
</form>
{% endblock %}
