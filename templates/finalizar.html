{% extends "home.html" %}
{% block titulo %}Finalizar compra{% endblock %}
{% block conteudo %}
<section class="auth-section finalizar-container">
  <h1 class="secao finalizar-titulo">Finalizar Compra</h1>
  
  <form method="post" class="formulario finalizar-form">
    {% csrf_token %}
    {{ form.as_p }}
    
    <div class="resumo-linha finalizar-resumo">
      <span class="finalizar-resumo-texto">Total a pagar:</span>
      <strong class="finalizar-resumo-valor">R$ {{ total }}</strong>
    </div>
    
    <button type="submit" class="botao finalizar-btn">Confirmar Pedido Seguro</button>
  </form>
</section>
{% endblock %}
