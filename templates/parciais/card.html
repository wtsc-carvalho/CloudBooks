<article class="card">
  <a href="{% url 'livro' livro.pk %}">
    
    {% if livro.capa_url %}
      <img class="capa" src="{{ livro.capa_url }}" alt="Capa do livro {{ livro.titulo }}">
    {% elif livro.capa %}
      <img class="capa" src="{{ livro.capa.url }}" alt="Capa do livro {{ livro.titulo }}">
    {% else %}
      <!-- Capa gerada via CSS que NUNCA quebra o layout -->
      <div class="capa" style="display: flex; align-items: center; justify-content: center; padding: 1.5rem; background: var(--cor-paineis); border: 2px solid var(--cor-roxo-principal); border-radius: 8px; color: var(--cor-dourado-claro); font-weight: bold; text-align: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);">
        <span>{{ livro.titulo }}</span>
      </div>
    {% endif %}
    
    <h3>{{ livro.titulo }}</h3>
  </a>
  
  <p class="autor">{{ livro.autor }}</p>
  <p class="preco">R$ {{ livro.preco_final }}</p>
  
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'adicionar_carrinho' livro.pk %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="botao pequeno">Adicionar ao carrinho</button>
  </form>
  {% else %}
  <a class="botao pequeno secundario" href="{% url 'login' %}">Entrar para comprar</a>
  {% endif %}
</article>
