{% extends "home.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<section class="auth-box glass-panel">
  <h1 style="margin: 0 0 0.5rem 0; font-size: 2rem;">Bem-vindo de volta!</h1>
  <p style="color: var(--cor-texto-suave); margin-bottom: 2rem;">Entre na sua conta e continue sua jornada</p>
  
  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    
    {% if erro %}
    <p style="color: #FF6B8B; background: rgba(255, 107, 139, 0.1); padding: 0.8rem; border-radius: 8px;">{{ erro }}</p>
    {% endif %}
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
      <label style="margin: 0; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" style="width: auto;"> Lembrar de mim
      </label>
      <a href="#" style="color: var(--cor-texto-suave);">Esqueci minha senha?</a>
    </div>
    
    <button type="submit" class="btn-gold" style="width: 100%;">Entrar →</button>
  </form>
  
  <div style="margin: 1.5rem 0; color: var(--cor-texto-suave); font-size: 0.9rem; position: relative;">
    <hr style="border-color: rgba(255,255,255,0.1); margin-bottom: -10px;">
    <span style="background: rgba(20, 15, 35, 1); padding: 0 10px;">ou</span>
  </div>
  
  <button class="btn-dark-outline" style="width: 100%;">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Entrar com Google
  </button>
  
  <p style="margin-top: 2rem; color: var(--cor-texto-suave); font-size: 0.95rem;">
    Não tem uma conta? <a href="{% url 'cadastro' %}" style="color: var(--cor-dourado-principal);">Cadastre-se</a>
  </p>
</section>
{% endblock %}
